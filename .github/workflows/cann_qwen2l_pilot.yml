name: "CANN P3 (Qwen2L 2-layer -> OM, kirinx90 tools)"

on:
  workflow_dispatch:

env:
  # 华为开发者网站 Tools 下载直链（内容中心 CDN，需带浏览器 UA/Referer 才放行）
  DDK_URL: "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/fa/v3/KmYm4fyVQhy8lN4CUfJAqw/DDK-tools-next-6.1.1.0.zip?HW-CC-KV=V1&HW-CC-Date=20260825T033306Z&HW-CC-Expire=315360000&HW-CC-Sign=33C3C5C5F4CFF52915D68ECB39A80BCED72327A0AAB05898C02BA1E88A957F6D"
  DDK_SHA256: "87d7e3f186ad5c527a9385cea555559ea53c63b87dc483820523bcf7bf6f87e5"
  PLUGIN_URL: "https://contentcenter-vali-drcn.dbankcdn.cn/pvt_2/DeveloperAlliance_package_901_9/b5/v3/NnZ7SJm2Sb6nIz2vO7EVzA/kirinx90-plugin-next-6.1.1.0.zip?HW-CC-KV=V1&HW-CC-Date=20260825T033001Z&HW-CC-Expire=315360000&HW-CC-Sign=52C3D9CE3C69DCD9051622FF7FD8080E18E63BB16CC1EF1F022410703EFBD80F"
  PLUGIN_SHA256: "0657efdddd2267949e83af2a382603b523d30b258d72e077a6975eb87d4f10b1"

jobs:
  qwen2l:
    runs-on: ubuntu-22.04
    steps:
      - name: 1. Checkout
        uses: actions/checkout@v4

      - name: 2. Free Up Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: 3. Download DDK + kirinx90 plugin (华为 CDN)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -fL --retry 3 -A "$UA" -e "https://developer.huawei.com/consumer/cn/doc/" -o ddk.zip "$DDK_URL"
          echo "$DDK_SHA256  ddk.zip" | sha256sum -c -
          curl -fL --retry 3 -A "$UA" -e "https://developer.huawei.com/consumer/cn/doc/" -o kirinx90.zip "$PLUGIN_URL"
          echo "$PLUGIN_SHA256  kirinx90.zip" | sha256sum -c -
          ls -lh ddk.zip kirinx90.zip

      - name: 4. Install tools (解压 + 平台插件装入 platform/)
        run: |
          unzip -q ddk.zip && unzip -q kirinx90.zip
          cp -r image/ddk_platform_plugin/kirinx90 DDK-tools-next-6.1.1.0/tools/platform/
          chmod +x DDK-tools-next-6.1.1.0/tools/tools_omg/omg DDK-tools-next-6.1.1.0/tools/tools_omg/master/omg

      - name: 5. Download Qwen2.5-0.5B fp16 ONNX + deps
        run: |
          pip install -q -U "huggingface_hub[cli]" onnx onnxruntime onnxsim numpy
          hf download onnx-community/Qwen2.5-0.5B-Instruct --include "onnx/model_fp16.onnx*" --local-dir ./hf_model
          ls -lh hf_model/onnx

      # 图手术 + ORT 参考链路 + OMG 双桶转换（内嵌沿用本仓库 mindspore_llm_converter.yml 的
      # heredoc 先例；路径统一 safe_path 规范化并限制在 checkout 目录内，无任何外部输入）
      - name: 6. Surgery + reference + OMG convert
        env:
          OMG_PATH: DDK-tools-next-6.1.1.0/tools/tools_omg/omg
        run: |
          export OMG_PATH
          python - <<'PYEOF'
          import json, os, re, subprocess, sys
          import numpy as np
          import onnx
          import onnxsim
          from onnx import TensorProto, helper, numpy_helper

          HF_ONNX = "hf_model/onnx/model_fp16.onnx"
          OUT_DIR = "cann/out"
          VOCAB_KEEP, SEQ, PAST = 1024, 8, 1
          REPO_ROOT = os.path.abspath(os.getcwd())

          def safe_path(*parts):
              p = os.path.abspath(os.path.join(*parts))
              if p != REPO_ROOT and not p.startswith(REPO_ROOT + os.sep):
                  raise ValueError("path escapes repository root: " + p)
              return p

          def log(*a):
              print("[surgery]", *a, flush=True)

          def sanitize(name):
              return re.sub(r"[^A-Za-z0-9]", "_", name)

          rng = np.random.RandomState(0)
          os.makedirs(safe_path(OUT_DIR), exist_ok=True)

          log("loading", HF_ONNX)
          model = onnx.load(safe_path(HF_ONNX))
          graph = model.graph
          inits = {i.name: i for i in graph.initializer}
          log("graph: nodes=%d inputs=%d outputs=%d inits=%d" % (
              len(graph.node), len(graph.input), len(graph.output), len(graph.initializer)))
          for gi in graph.input:
              dims = [(d.dim_param or d.dim_value) for d in gi.type.tensor_type.shape.dim]
              log("  in :", gi.name, TensorProto.DataType.Name(gi.type.tensor_type.elem_type), dims)

          def node_inits(node):
              return [i for i in node.input if i in inits]

          norm_node = next(n for n in graph.node
                           if any(re.match(r"model\.norm\.", x) for x in node_inits(n)))
          anchor = next(n for n in graph.node if
                        any(x.startswith("model.layers.2.input_layernorm") for x in node_inits(n)))
          # 该导出图的 Mul 是 [权重, 数据] 顺序（见 norm node 日志），数据输入必须按
          # “非初始化器”定位，盲取 input[0] 会把权重当 hidden 接走
          anchor_data_idx = [k for k, i in enumerate(anchor.input) if i and i not in inits]
          assert len(anchor_data_idx) == 1, ("anchor data input ambiguous", list(anchor.input))
          cut_tensor = anchor.input[anchor_data_idx[0]]
          log("norm node:", norm_node.op_type, "inputs:", list(norm_node.input))
          log("anchor:", anchor.name, "cut_tensor:", cut_tensor)

          # 数据输入位 = 非初始化器的那个输入（Mul 的操作数顺序在导出里不保证）
          norm_data_idx = [k for k, i in enumerate(norm_node.input)
                           if i and i not in inits]
          assert len(norm_data_idx) == 1, ("norm data input ambiguous", list(norm_node.input))
          norm_node.input[norm_data_idx[0]] = cut_tensor

          for go in graph.output:
              log("  out:", go.name)

          past_inputs = [gi.name for gi in graph.input
                         if re.match(r"past_key_values\.(0|1)\.(key|value)$", gi.name)]
          assert len(past_inputs) == 4, past_inputs
          log("past inputs kept:", past_inputs)

          def present_vi_for(past_name):
              m = re.match(r"past_key_values\.(\d+)\.(key|value)$", past_name)
              idx, kv = m.group(1), m.group(2)
              cands = [o for o in graph.output
                       if re.search(r"(^|\.)present\." + idx + r"\." + kv + r"$",
                                    o.name, re.IGNORECASE)]
              assert len(cands) == 1, (past_name, [o.name for o in graph.output])
              return cands[0]

          norm_node.input[0] = cut_tensor
          producer = {}
          for n in graph.node:
              for o in n.output:
                  producer[o] = n
          present_outputs = []
          stack = [norm_node]
          for pi in past_inputs:
              vi = present_vi_for(pi)
              present_outputs.append(vi)
              log("  present:", pi, "->", vi.name)
              stack.append(producer[vi.name])
          seen = set()
          while stack:
              n = stack.pop()
              if id(n) in seen:
                  continue
              seen.add(id(n))
              for i in n.input:
                  p = producer.get(i)
                  if p is not None and id(p) not in seen:
                      stack.append(p)
          graph_inputs_all = {g.name for g in graph.input}
          topo_nodes = [n for n in graph.node if id(n) in seen]
          log("kept nodes:", len(topo_nodes), "/", len(graph.node))

          # 熔断：闭包只应覆盖 layer0/1（约占 1/12），失控即带诊断退出
          if len(topo_nodes) > len(graph.node) // 4:
              offenders = [n.name or n.op_type for n in topo_nodes
                           if any("layers.2." in x or "layers.23." in x for x in n.input)]
              sys.exit(f"closure escaped: kept={len(topo_nodes)} sample_offenders={offenders[:5]}")

          kept_input_names = set()
          for n in topo_nodes:
              for i in n.input:
                  if i not in inits and i in graph_inputs_all:
                      kept_input_names.add(i)
          kept_past = [x for x in kept_input_names if x.startswith("past")]
          assert len(kept_past) == 4, ("kept past inputs wrong", sorted(kept_past))
          log("kept past inputs:", sorted(kept_past))

          ref_init_names = set()
          for n in topo_nodes:
              ref_init_names.update(i for i in n.input if i in inits)
          new_inits = [inits[name] for name in ref_init_names]
          embed_name = next(nm for nm in ref_init_names if nm.startswith("model.embed_tokens"))
          emb = numpy_helper.to_array(inits[embed_name])
          log("embed:", emb.shape, emb.dtype, "-> slicing to", VOCAB_KEEP)
          emb2 = np.ascontiguousarray(emb[:VOCAB_KEEP])
          new_inits = [numpy_helper.from_array(emb2, embed_name) if i.name == embed_name else i
                       for i in new_inits]
          HIDDEN = int(emb2.shape[1])
          del emb

          new_inputs = [vi for vi in graph.input if vi.name in kept_input_names]
          log("kept graph inputs:", [vi.name for vi in new_inputs])

          # NPU 侧对 int64 输入支持存疑（MindSpore NPU 先例是 int32 主输入）：
          # 三个 int64 输入改为 int32 入口，图内首个节点 Cast 回 int64 保持原语义
          cast_nodes = []
          for k, vi in enumerate(new_inputs):
              if vi.type.tensor_type.elem_type != TensorProto.INT64:
                  continue
              dims = [d.dim_param or d.dim_value for d in vi.type.tensor_type.shape.dim]
              cast_nodes.append(helper.make_node(
                  "Cast", [vi.name + "_i32in"], [vi.name],
                  to=TensorProto.INT64, name="cast_in_" + vi.name))
              new_inputs[k] = helper.make_tensor_value_info(
                  vi.name + "_i32in", TensorProto.INT32, dims)
          topo_nodes = cast_nodes + topo_nodes

          # 输出直接挂 RMSNorm 的真实输出张量（不要发明新名字，ORT 会查无此张量）
          HIDDEN_OUT = norm_node.output[0]
          log("hidden output tensor:", HIDDEN_OUT)
          # 该导出在 final norm 前把 hidden 折成 2D [batch*seq, 896]（norm 输出直连 2D MatMul lm_head），
          # 必须按 rank-2 声明，否则 onnxsim/ORT 的 shape 校验冲突
          new_outputs = [helper.make_tensor_value_info(HIDDEN_OUT, TensorProto.FLOAT16,
                                                       ["bs", HIDDEN])]
          new_outputs += present_outputs
          new_graph = helper.make_graph(topo_nodes, "qwen2l", new_inputs, new_outputs, new_inits)
          m2 = helper.make_model(new_graph, opset_imports=model.opset_import)
          m2.ir_version = model.ir_version
          onnx.save(m2, safe_path(OUT_DIR, "qwen2l.onnx"))
          log("saved qwen2l.onnx", os.path.getsize(safe_path(OUT_DIR, "qwen2l.onnx")), "bytes")

          import onnxruntime as ort

          # 剪枝后的 fp16 图会触发 ORT SimplifiedLayerNormFusion 的精度 cast 插入 bug，
          # 参考推理关闭图优化，按原始 ONNX 语义跑
          so = ort.SessionOptions()
          so.graph_optimization_level = ort.GraphOptimizationLevel.ORT_DISABLE_ALL
          so.log_severity_level = 3
          sess = ort.InferenceSession(safe_path(OUT_DIR, "qwen2l.onnx"),
                                      sess_options=so, providers=["CPUExecutionProvider"])
          sess_inputs = sess.get_inputs()
          out_names = [o.name for o in sess.get_outputs()]
          out_dtype = {o.name: o.type for o in sess.get_outputs()}
          for i in sess_inputs:
              log("ORT in :", i.name, i.type, i.shape)
          log("ORT outs:", out_names)

          def resolve_dim(dim_name, bucket):
              n = dim_name.lower()
              if "past" in n and ("+" in n or "plus" in n):
                  return bucket["past"] + bucket["seq"]
              if "past" in n:
                  return bucket["past"]
              if "total" in n:
                  return bucket["total"]
              if "batch" in n or "num" in n or "head" in n:
                  return 1
              if "cache" in n or "seq" in n or "position" in n:
                  return bucket["seq"]
              log("  [dim fallback->seq]", dim_name)
              return bucket["seq"]

          def present_for(past_name):
              idx = re.search(r"(\d+)", past_name).group(1)
              kv = "key" if "key" in past_name.lower() else (
                  "value" if "value" in past_name.lower() else "")
              cands = [o for o in out_names
                       if idx in re.findall(r"\d+", o) and (kv in o.lower() if kv else True)]
              assert len(cands) == 1, (past_name, cands)
              return cands[0]

          def _idtype(dt):
              # 图入口已改为 int32（NPU 友好），喂什么 dtype 以会话元数据为准
              return np.int64 if "int64" in dt else (np.int32 if "int32" in dt else np.float32)

          def build_feed(bucket, ids_value, pos_value, mask_value, past_map):
              feeds = {}
              for meta in sess_inputs:
                  name, shape, dt = meta.name, meta.shape, meta.type
                  dims = [d if isinstance(d, int) else resolve_dim(d, bucket) for d in shape]
                  if "input_ids" in name:
                      arr = np.asarray(ids_value, dtype=_idtype(dt)).reshape(dims)
                  elif "position" in name:
                      arr = np.asarray(pos_value, dtype=_idtype(dt)).reshape(dims)
                  elif "attention_mask" in name:
                      arr = np.asarray(mask_value, dtype=_idtype(dt)).reshape(dims)
                  elif "past" in name:
                      arr = past_map[name]
                  else:
                      arr = np.zeros(dims, dtype=np.float16 if "float16" in dt else np.float32)
                  feeds[name] = arr
              return feeds

          def dump_feed(tag, feeds, dir_rel):
              out_dir = safe_path(OUT_DIR, "case", dir_rel)
              os.makedirs(out_dir, exist_ok=True)
              lines = []
              for name, arr in feeds.items():
                  fname = sanitize(name) + ".bin"
                  arr.tofile(safe_path(OUT_DIR, "case", dir_rel, fname))
                  lines.append(f"{fname} {arr.nbytes}")
                  log(f"  {tag} in  {name} {arr.shape} {arr.dtype} -> {fname} ({arr.nbytes}B)")
              with open(safe_path(OUT_DIR, "case", dir_rel, "inputs.txt"), "w") as f:
                  f.write("\n".join(lines) + "\n")

          def dump_outputs(tag, named, dir_rel):
              out_dir = safe_path(OUT_DIR, "case", dir_rel)
              os.makedirs(out_dir, exist_ok=True)
              lines = []
              for name, arr in named.items():
                  fname = sanitize(name) + ".dev.bin"
                  arr.tofile(safe_path(OUT_DIR, "case", dir_rel, fname))
                  dt = out_dtype[name]
                  if "float" in dt:
                      ref = fname.replace(".dev.bin", ".ref32.bin")
                      arr.astype(np.float32).tofile(safe_path(OUT_DIR, "case", dir_rel, ref))
                      tag2 = "F32"  # 设备侧已强制 --output_type FP32，按 F32 对拍
                  else:
                      ref, tag2 = fname, "NA"
                  lines.append(f"{fname} {ref} {arr.nbytes} {tag2}")
                  log(f"  {tag} out {name} {arr.shape} {arr.dtype} -> {fname} [{tag2}]")
              with open(safe_path(OUT_DIR, "case", dir_rel, "outputs.txt"), "w") as f:
                  f.write("\n".join(lines) + "\n")

          bucket_p = {"seq": SEQ, "past": PAST, "total": SEQ + PAST}
          bucket_d = {"seq": 1, "past": SEQ + PAST, "total": SEQ + PAST + 1}

          def static_shapes(bucket):
              return {m.name: [d if isinstance(d, int) else resolve_dim(d, bucket)
                               for d in m.shape] for m in sess_inputs}

          past_map_p = {}
          for meta in sess_inputs:
              if "past" in meta.name:
                  past_map_p[meta.name] = np.zeros(
                      static_shapes(bucket_p)[meta.name],
                      dtype=np.float16 if "float16" in meta.type else np.float32)

          ids0 = rng.randint(0, VOCAB_KEEP, size=SEQ).astype(np.int64)
          omg = safe_path(os.environ["OMG_PATH"])
          omg_cwd = os.path.dirname(omg)
          meta = {"inputs": {vi.name: [(d.dim_param or d.dim_value)
                                       for d in vi.type.tensor_type.shape.dim]
                             for vi in new_inputs}, "omg": {}}

          # 每桶：onnxsim 静态特化（把 Shape/ConstantOfShape/Trilu 掩码链折叠成常量，
          # kirinx90 不支持 Trilu——预检唯一失败算子）→ ORT 参考运行 → OMG 转换
          so = ort.SessionOptions()
          so.graph_optimization_level = ort.GraphOptimizationLevel.ORT_DISABLE_ALL
          so.log_severity_level = 3

          def fix_gather_indices(mp):
              """kirinx90 的 GatherV2D 拒收 int64 indices（onnxsim 折叠出的常量多为 int64）。
              ONNX 规范允许 indices 用 int32：常量直接重写，非常量插 Cast。"""
              g = mp.graph
              inferred = onnx.shape_inference.infer_shapes(mp)
              dtmap = {}
              for vi in list(inferred.graph.value_info) + list(inferred.graph.input):
                  dtmap[vi.name] = vi.type.tensor_type.elem_type
              init_map = {i.name: i for i in g.initializer}
              fixes = []
              for n in g.node:
                  if n.op_type != "Gather" or len(n.input) < 2:
                      continue
                  idx_t = n.input[1]
                  dt = dtmap.get(idx_t)
                  if dt is None and idx_t in init_map:
                      dt = init_map[idx_t].data_type
                  if dt == TensorProto.INT64:
                      fixes.append((n, idx_t))
              for n, idx_t in fixes:
                  if idx_t in init_map:
                      arr = numpy_helper.to_array(init_map[idx_t])
                      g.initializer.remove(init_map[idx_t])
                      new_t = numpy_helper.from_array(arr.astype(np.int32), idx_t + "_i32")
                      g.initializer.append(new_t)
                      init_map[new_t.name] = new_t
                  else:
                      cast = helper.make_node("Cast", [idx_t], [idx_t + "_i32"],
                                              to=TensorProto.INT32,
                                              name=idx_t.strip("/") + "_to_i32")
                      g.node.insert(list(g.node).index(n), cast)
                  n.input[1] = idx_t + "_i32"
              log("gather int64->int32 fixes:", len(fixes))
              return mp

          def run_bucket(tag, bucket, ids_value, pos_value, mask_value, past_map):
              sim, ok = onnxsim.simplify(
                  onnx.load(safe_path(OUT_DIR, "qwen2l.onnx")),
                  overwrite_input_shapes=static_shapes(bucket))
              assert ok, "onnxsim failed: " + tag
              fix_gather_indices(sim)
              p_onnx = safe_path(OUT_DIR, "qwen2l_" + tag + ".onnx")
              onnx.save(sim, p_onnx)
              log("simplified", tag, os.path.getsize(p_onnx), "bytes")

              s = ort.InferenceSession(p_onnx, sess_options=so,
                                       providers=["CPUExecutionProvider"])
              feeds = build_feed(bucket, ids_value, pos_value, mask_value, past_map)
              named = dict(zip([o.name for o in s.get_outputs()], s.run(None, feeds)))
              log(tag, "ok; hidden:", named[HIDDEN_OUT].shape)
              dump_feed(tag, feeds, tag)
              dump_outputs(tag, named, tag)

              parts = []
              for vi in new_inputs:
                  dims = []
                  for d in vi.type.tensor_type.shape.dim:
                      dims.append(str(d.dim_value if d.dim_value
                                      else resolve_dim(d.dim_param, bucket)))
                  parts.append(vi.name + ":" + ",".join(dims))
              otypes = ";".join(o.name + ":FP32" for o in new_outputs)
              cmd = [omg, "--model", p_onnx, "--framework", "5",
                     "--output", safe_path(OUT_DIR, "qwen2l_" + tag),
                     "--output_type", otypes,
                     "--input_shape", ";".join(parts)]
              meta["omg"][tag] = " ".join(cmd)
              log("RUN:", " ".join(cmd))
              r = subprocess.run(cmd, cwd=omg_cwd, capture_output=True, text=True)
              tail = (r.stdout + r.stderr).splitlines()[-25:]
              log(f"omg {tag} rc={r.returncode}\n" + "\n".join(tail))
              if r.returncode != 0:
                  crj = os.path.join(omg_cwd, "check_result.json")
                  if os.path.exists(crj):
                      log("check_result.json:")
                      with open(crj, "r", encoding="utf-8", errors="replace") as f:
                          print(f.read()[:8000], flush=True)
                  sys.exit("omg " + tag + " failed")
              return named

          named_p = run_bucket("prefill", bucket_p,
                               ids0.reshape(1, SEQ),
                               np.arange(SEQ, dtype=np.int64).reshape(1, SEQ),
                               np.array([[0] + [1] * SEQ], dtype=np.int64),
                               past_map_p)
          past_map_d = {m.name: named_p[present_for(m.name)]
                        for m in sess_inputs if "past" in m.name}
          named_d = run_bucket("decode", bucket_d,
                               np.array([[int((ids0[-1] + 1) % VOCAB_KEEP)]]),
                               np.array([[SEQ]], dtype=np.int64),
                               np.array([[0] + [1] * (SEQ + PAST - 1) + [1]], dtype=np.int64),
                               past_map_d)

          with open(safe_path(OUT_DIR, "meta.json"), "w") as f:
              json.dump(meta, f, indent=1)
          log("DONE: case dirs + 2 OM ready")
          PYEOF
          PYEOF
          find cann/out -type f | head -40
          ls -la cann/out/

      - name: 7. Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qwen2l-om
          path: |
            cann/out/case/
            cann/out/*.om
            cann/out/meta.json
            DDK-tools-next-6.1.1.0/tools/tools_omg/check_result.json
          if-no-files-found: warn
